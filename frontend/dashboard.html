<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2713%27 cy=%2719%27 r=%2711%27 fill=%27%230b4f5c%27/%3E%3Ccircle cx=%2725%27 cy=%279%27 r=%276%27 fill=%27%237dd6d1%27/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
<title>My orders | Sudsy</title>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="19" r="11" fill="#0b4f5c"/><circle cx="25" cy="9" r="6" fill="#7dd6d1"/><circle cx="9" cy="15" r="3" fill="#f4d03f"/></svg> Sudsy</a>
    <nav class="nav" aria-label="Account">
      <div class="bell"><button class="icon-btn" id="notifBell" aria-label="Notifications" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-count" id="notifCount" hidden>0</span></button><div class="notif-panel" id="notifPanel" hidden><div class="notif-head"><span>Notifications</span><button class="btn ghost sm" id="markAllRead" type="button">Mark all read</button></div><div id="notifList"></div></div></div>
      <button class="btn ghost sm" id="profileBtn" type="button">Profile</button>
      <img class="avatar" id="userAvatar" alt="" width="40" height="40">
      <span id="userName" class="small" style="max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container">
    <div class="page-head">
      <h1 id="greeting">Your laundry</h1>
      <p class="muted">Book a drop-off and follow every order live.</p>
    </div>

    <div class="two-col">
      <section class="card" aria-labelledby="bookTitle">
        <div class="card-head"><h2 id="bookTitle">Book a drop-off</h2></div>
        <div id="bookMessage" role="alert" hidden></div>
        <form id="bookingForm" novalidate>
          <div class="field-row">
            <div class="field"><label for="branch">Drop-off branch</label><select id="branch" required></select></div>
            <div class="field"><label for="pickup">Preferred pickup date</label><input id="pickup" type="date"></div>
          </div>
          <label>Items</label>
          <div id="items"></div>
          <button class="btn ghost sm" id="addItem" type="button" style="margin-top:0.7rem">Add another item</button>
          <div class="calc" aria-live="polite">
            <div><div class="label">Estimated total</div><div class="small" id="calcNote">Final price is confirmed at the counter.</div></div>
            <div class="amount" id="calcTotal">&#8369;0.00</div>
          </div>
          <button class="btn lemon block" type="submit">Place order</button>
        </form>
      </section>

      <section class="card" aria-labelledby="ordersTitle">
        <div class="card-head">
          <h2 id="ordersTitle">My orders</h2>
          <div class="tabs" role="tablist" aria-label="Order filter">
            <button class="tab" role="tab" data-filter="active" aria-selected="true">Active</button>
            <button class="tab" role="tab" data-filter="past" aria-selected="false">Past</button>
          </div>
        </div>
        <div id="orders" aria-live="polite"></div>
      </section>
    </div>

    <section class="card" style="margin-top:1.25rem" aria-labelledby="menuTitle">
      <div class="card-head"><h2 id="menuTitle">Service menu</h2></div>
      <div class="service-grid" id="menu"></div>
    </section>
  </div>
</main>

<dialog id="profileDialog">
  <form method="dialog" id="profileForm">
    <h2>Your profile</h2>
    <div class="field"><label for="pName">Full name</label><input id="pName" required></div>
    <div class="field"><label for="pPhone">Mobile number</label><input id="pPhone" type="tel"></div>
    <div class="field"><label for="pEmail">Email</label><input id="pEmail" disabled></div>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" id="profileCancel">Cancel</button>
      <button class="btn" type="submit">Save changes</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
