<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2713%27 cy=%2719%27 r=%2711%27 fill=%27%230b4f5c%27/%3E%3Ccircle cx=%2725%27 cy=%279%27 r=%276%27 fill=%27%237dd6d1%27/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
<title>Create account | Sudsy</title>
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side" style="background-image:url(https://images.unsplash.com/photo-1582735689369-4fe89db7114c?auto=format&fit=crop&w=1000&q=70)"><h2>Spend less time on laundry.</h2><p>Create an account to book drop-offs and get a message when your order is ready.</p></aside>
  <main class="auth-main">
    <div class="auth-card">
      <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="19" r="11" fill="#0b4f5c"/><circle cx="25" cy="9" r="6" fill="#7dd6d1"/><circle cx="9" cy="15" r="3" fill="#f4d03f"/></svg> Sudsy</a>
      <h1 style="font-size:2rem;margin-top:1.5rem">Create your account</h1>
      <p class="muted">It takes under a minute.</p>
      <div id="formMessage" role="alert" hidden></div>
      <form id="registerForm" novalidate>
        <div class="field"><label for="fullName">Full name</label><input id="fullName" type="text" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel" placeholder="0917 123 4567"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><p class="hint">At least 8 characters.</p></div>
        <button class="btn block" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:1.25rem">Already registered? <a href="/login.html">Sign in</a></p>
      <p class="hint">Shop staff: ask your shop admin to switch your account to staff after you sign up.</p>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
